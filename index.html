<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Будешь моим Валентином?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffd6e7;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            background-color: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 600px;
            width: 90%;
            transition: all 0.5s ease;
        }

        .image-container {
            margin-bottom: 30px;
            position: relative;
        }

        .image-container img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .image-container video {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            display: none;
            object-fit: cover;
            margin: 0 auto;
        }

        .question {
            font-size: 28px;
            font-weight: bold;
            color: #ff69b4;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-yes {
            background-color: #ff69b4;
            color: white;
            transform-origin: center;
            z-index: 10;
        }

        .btn-no {
            background-color: #ffcccb;
            color: #ff69b4;
        }

        .success {
            text-align: center;
            animation: celebrate 0.5s ease infinite alternate;
        }

        .success h2 {
            font-size: 48px;
            color: #ff69b4;
            margin-top: 20px;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.5);
        }

        .hearts {
            position: absolute;
            font-size: 30px;
            color: #ff69b4;
            animation: float 3s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes float {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1.5);
                opacity: 0;
            }
        }

        @keyframes celebrate {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <div class="image-container">
            <img src="bear_love.jpg" alt="Романтическая картинка" id="mainImage">
            <video id="successVideo" muted autoplay loop playsinline poster="bear_love.jpg">
                <source src="cute_video.mp4" type="video/mp4">
                <img src="fallback_image.jpg" alt="Резервная картинка">
            </video>
        </div>
        <div class="question" id="questionText">Дима, будешь моим Валентином?</div>
        <div class="buttons" id="buttonContainer">
            <button class="btn btn-yes" id="yesBtn">ДА</button>
            <button class="btn btn-no" id="noBtn">НЕТ</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainContainer = document.getElementById('mainContainer');
        const questionText = document.getElementById('questionText');
        const buttonContainer = document.getElementById('buttonContainer');
        const mainImage = document.getElementById('mainImage');
        const successVideo = document.getElementById('successVideo');
        const body = document.body;

        // Тексты для кнопки "нет"
        const noTexts = [
            "Точно нет?",
            "Жаль...",
            "Ладно...",
            "Ну пожалуйста?",
            "Подумай еще раз!",
            "Может всё-таки да?",
            "Я буду грустить :(",
            "Окей, последний шанс!",
            "Я так надеялась...",
            "Пожалуйста, ну скажи да!",
            "Ты точно меня не любишь?"
        ];
        
        let noTextIndex = 0;
        let isAnimating = false;
        let textChangeInterval = null;
        let animationFrameId = null;
        let isMouseOverNoBtn = false;
        let currentScale = 1;

        // Обработчик для кнопки "да"
        yesBtn.addEventListener('click', function() {
            celebrate();
        });

        // Обработчик для кнопки "нет" - при наведении
        noBtn.addEventListener('mouseenter', function() {
            if (isAnimating) return;
            
            isMouseOverNoBtn = true;
            
            // Начинаем менять текст постоянно
            textChangeInterval = setInterval(() => {
                noBtn.textContent = noTexts[noTextIndex];
                noTextIndex = (noTextIndex + 1) % noTexts.length;
            }, 700);
            
            // Запускаем анимацию кнопки "да"
            startYesButtonAnimation();
        });

        // Обработчик для кнопки "нет" - когда убираем курсор
        noBtn.addEventListener('mouseleave', function() {
            isMouseOverNoBtn = false;
            
            if (textChangeInterval) {
                clearInterval(textChangeInterval);
                textChangeInterval = null;
            }
            // Возвращаем исходный текст
            noBtn.textContent = "НЕТ";
            noTextIndex = 0;
            
            // Останавливаем анимацию (но не сбрасываем состояние)
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
                isAnimating = false;
            }
        });

        function startYesButtonAnimation() {
            isAnimating = true;
            
            // Анимация расширения кнопки "да"
            const animate = () => {
                // Проверяем, всё ещё ли курсор на кнопке "нет"
                if (!isMouseOverNoBtn) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                    isAnimating = false;
                    return;
                }
                
                // Просто увеличиваем масштаб кнопки "да"
                currentScale += 0.005;
                
                yesBtn.style.transform = `scale(${currentScale})`;
                
                // Если кнопка "да" достаточно большая, чтобы закрыть кнопку "нет"
                if (currentScale > 3) {
                    // Автоклик по кнопке "да"
                    setTimeout(() => {
                        celebrate();
                    }, 100);
                    return;
                }
                
                animationFrameId = requestAnimationFrame(animate);
            };
            
            animate();
        }

        function celebrate() {
            // Останавливаем все анимации
            isAnimating = false;
            isMouseOverNoBtn = false;
            
            if (textChangeInterval) {
                clearInterval(textChangeInterval);
                textChangeInterval = null;
            }
            
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
            
            // Создаем эффект праздника
            createHearts();
            
            // Меняем картинку на видео
            mainImage.style.display = 'none';
            successVideo.style.display = 'block';
            successVideo.play();
            
            questionText.textContent = "Круто класс!";
            questionText.style.fontSize = '48px';
            questionText.style.color = '#ff1493';
            
            // Убираем кнопки
            buttonContainer.style.display = 'none';
            
            // Добавляем анимацию контейнера
            mainContainer.style.animation = 'celebrate 0.5s ease infinite alternate';
            
            // Меняем фон на более праздничный
            body.style.background = 'linear-gradient(135deg, #ff9eb5 0%, #ffb6c1 50%, #ff69b4 100%)';
        }

        function createHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'hearts';
                heart.innerHTML = '❤️';
                
                // Случайная позиция
                const posX = Math.random() * window.innerWidth;
                const posY = window.innerHeight;
                
                heart.style.left = `${posX}px`;
                heart.style.top = `${posY}px`;
                
                body.appendChild(heart);
                
                // Удаляем сердечко через 3 секунды
                setTimeout(() => {
                    heart.remove();
                }, 3000);
            }, 300);
        }

        // Добавляем возможность кликнуть на кнопку "да" в любой момент
        yesBtn.addEventListener('click', celebrate);
    </script>
</body>
</html>
